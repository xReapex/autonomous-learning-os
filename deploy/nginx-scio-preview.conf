server {
    listen 80;
    listen [::]:80;
    server_name scio-preview.141.227.152.154.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scio-preview.141.227.152.154.nip.io;

    ssl_certificate /etc/letsencrypt/live/scio-preview.141.227.152.154.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scio-preview.141.227.152.154.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    limit_req_status 429;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:4324;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/mobile/auth/ {
        limit_req zone=learningos_req burst=10 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:4324;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Learning-OS-Mutation "";
        proxy_set_header X-Internal-Secret "";
        proxy_hide_header X-Learning-OS-Mutation;
        proxy_hide_header X-Internal-Secret;
    }

    location ^~ /api/mobile/data/ {
        limit_req zone=learningos_req burst=30 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:4324;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Learning-OS-Mutation "";
        proxy_set_header X-Internal-Secret "";
        proxy_hide_header X-Learning-OS-Mutation;
        proxy_hide_header X-Internal-Secret;
    }

    location ^~ /api/mobile/curriculum/jobs {
        limit_req zone=learningos_req burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:4324;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Learning-OS-Mutation "";
        proxy_set_header X-Internal-Secret "";
        proxy_hide_header X-Learning-OS-Mutation;
        proxy_hide_header X-Internal-Secret;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api/mobile/curriculum/interview {
        limit_req zone=learningos_req burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:4324;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Learning-OS-Mutation "";
        proxy_set_header X-Internal-Secret "";
        proxy_hide_header X-Learning-OS-Mutation;
        proxy_hide_header X-Internal-Secret;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location / {
        return 404;
    }
}
