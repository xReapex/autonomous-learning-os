server {
    listen 80;
    listen [::]:80;
    server_name learning-os.141.227.152.154.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name learning-os.141.227.152.154.nip.io;

    # Adapter ces chemins au certificat de l'hôte.
    ssl_certificate /etc/letsencrypt/live/learning-os.141.227.152.154.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learning-os.141.227.152.154.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontière par défaut : toutes les routes sont protégées par Basic Auth.
    # Seul l’entretien mobile, protégé par un Bearer serveur, désactive cet héritage.
    auth_basic "Autonomous Learning OS";
    auth_basic_user_file /etc/nginx/.htpasswd-learning-os;
    auth_delay 750ms;
    limit_req_status 429;

    client_max_body_size 64k;
    limit_conn learningos_conn 10;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;

    # Les assets versionnés Next.js ont leur propre quota : ils ne doivent pas
    # consommer le burst réservé aux pages, RSC et API.
    location ^~ /_next/static/ {
        limit_req zone=learningos_static burst=120 nodelay;
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Learning-OS-Mutation-Secret "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    # Pages publiques requises par les Stores. Les quatre chemins seulement
    # sont accessibles sans Basic Auth ; toutes les API et le produit restent fermés.
    location ~ ^/(privacy|terms|support|account-deletion)/?$ {
        auth_basic off;
        limit_req zone=learningos_req burst=20 nodelay;
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Learning-OS-Mutation-Secret "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Robots-Tag;
        add_header X-Robots-Tag "index, follow" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /api/telegram {
        limit_req zone=learningos_req burst=60 nodelay;
        return 404;
    }

    location ^~ /api/mobile/auth/ {
        auth_basic off;
        limit_req zone=learningos_req burst=10 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Learning-OS-Mutation-Secret "";
        proxy_set_header X-Learning-OS-Authenticated-User "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
    }

    location ^~ /api/mobile/data/ {
        auth_basic off;
        limit_req zone=learningos_req burst=30 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Learning-OS-Mutation-Secret "";
        proxy_set_header X-Learning-OS-Authenticated-User "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    location ^~ /api/mobile/curriculum/jobs {
        auth_basic off;
        limit_req zone=learningos_mobile_interview burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Learning-OS-Mutation-Secret "";
        proxy_set_header X-Learning-OS-Authenticated-User "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
    }

    location = /api/mobile/curriculum/interview {
        # Le client transmet la session SCIO opaque stockée dans le trousseau sécurisé.
        auth_basic off;
        limit_req zone=learningos_mobile_interview burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Learning-OS-Mutation-Secret "";
        proxy_set_header X-Learning-OS-Authenticated-User "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
        proxy_hide_header X-Powered-By;
    }

    location = /api/curriculum {
        limit_req zone=learningos_req burst=60 nodelay;
        client_max_body_size 1m;
        client_body_buffer_size 1m;
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Cette directive remplace toute valeur fournie par le client.
        include /etc/nginx/snippets/autonomous-learning-os-mutation-secret.conf;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    location = /api/curriculum/interview {
        limit_req zone=learningos_req burst=60 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/snippets/autonomous-learning-os-mutation-secret.conf;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
        proxy_hide_header X-Powered-By;
    }

    location = /api/coach {
        limit_req zone=learningos_req burst=60 nodelay;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Learning-OS-Mutation-Secret "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    location ^~ /api/ {
        limit_req zone=learningos_req burst=60 nodelay;
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Learning-OS-Mutation-Secret "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    location / {
        limit_req zone=learningos_page burst=120 nodelay;
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Écrase tout secret éventuellement envoyé hors de la route curriculum.
        proxy_set_header X-Learning-OS-Mutation-Secret "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }
}
